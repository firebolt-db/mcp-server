name: pr

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:

  lint-semantic:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            deps
            revert
            chore
            docs
            style
            refactor
