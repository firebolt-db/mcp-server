name: pr

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:

  lint-semantic:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            deps
            revert
            chore
            docs
            style
            refactor
