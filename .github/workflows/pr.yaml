name: pr

on:
  pull_request_target:
    types:
      - opened
      - edited
      - synchronize
      - reopened

jobs:

  lint-semantic:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            deps
            revert
            chore
            docs
            style
            refactor
